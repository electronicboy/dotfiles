# Same order as the old bullet-train prompt (time, context, dir, git),
# plus the things that matter day to day: JVM version and kube context.
# Icons need a Nerd Font (installed by chezmoi, see .chezmoiexternal.toml.tmpl).
"$schema" = "https://starship.rs/config-schema.json"

format = """
$time$username$hostname$directory$git_branch$git_state$git_status\
$java$nodejs$kubernetes$cmd_duration
$character"""
add_newline = false

[time]
disabled = false
format = "[$time]($style) "
time_format = "%H:%M"
style = "dimmed white"

[username]
format = "[$user]($style)@"

[hostname]
ssh_only = true
format = "[$hostname]($style) "

[directory]
truncation_length = 4
truncate_to_repo = true

[java]
symbol = " "
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "

# Always show the active cluster: cheap insurance before `kubectl apply`.
[kubernetes]
disabled = false
symbol = "󱃾 "
format = "[$symbol$context(/$namespace)]($style) "

[cmd_duration]
min_time = 2000

[git_branch]
symbol = " "
